<script type="module">
/* ══ FIREBASE CONFIG ══════════════════════════════════════
   Config hiện đã được điền. Firebase API key của web app không phải password;
   quyền đọc/ghi thật sự vẫn do Realtime Database Security Rules quyết định.
   ═════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAur1oxUKDtQ8YAFQt4zVg1323lRjVnMKc",
  authDomain: "hoanglan-d05e0.firebaseapp.com",
  databaseURL: "https://hoanglan-d05e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hoanglan-d05e0",
  storageBucket: "hoanglan-d05e0.firebasestorage.app",
  messagingSenderId: "509026584738",
  appId: "1:509026584738:web:0bed51b443511fa0a7affb",
};
const USE_FIREBASE=Boolean(
  FIREBASE_CONFIG.apiKey &&
  FIREBASE_CONFIG.authDomain &&
  FIREBASE_CONFIG.databaseURL &&
  FIREBASE_CONFIG.projectId &&
  FIREBASE_CONFIG.appId &&
  !FIREBASE_CONFIG.apiKey.startsWith('YOUR_')
);

const MAX=15;
let groups={};
let currentStt=null;
let editingStt=null;
let hasRenderedOnce=false;
const seenGroupKeys=new Set();

const dot=document.getElementById('syncDot');
const lbl=document.getElementById('syncLabel');
const counter=document.getElementById('counter');
const grid=document.getElementById('grid');
const saveBtn=document.getElementById('saveBtn');
const sttInput=document.getElementById('fStt');
const formTitle=document.querySelector('#groupForm .panel-title');
const editBtn=document.getElementById('dEdit');
const searchInput=document.getElementById('searchInput');
const createGroupBtn=document.getElementById('createGroupBtn');
let returnFocus=null;
let toastTimer;

function icon(name){
  return '<svg class="icon" aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}

function notify(message,isError=false){
  const toast=document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent=message;
  toast.className='toast show'+(isError?' error':'');
  toastTimer=setTimeout(()=>toast.classList.remove('show'),5000);
}

function setStatus(type,text){
  dot.className='dot '+type;
  lbl.textContent=text;
}

function showLocalBanner(text){
  const banner=document.getElementById('mode-banner');
  document.getElementById('bannerMessage').textContent=text;
  banner.hidden=false;
}
document.getElementById('dismissBanner').onclick=()=>{
  document.getElementById('mode-banner').hidden=true;
};

function validGroup(g){
  return g && Number.isInteger(Number(g.stt)) && Number(g.stt)>0 &&
    Number(g.stt)<=99 && Array.isArray(g.members) &&
    g.members.every(m=>typeof m==='string') && g.links && typeof g.links==='object';
}

function safeLink(value){
  try{
    const url=new URL(value);
    return ['https:','http:'].includes(url.protocol)?url.href:null;
  }catch{return null;}
}

/* ═══ FIREBASE ═══ */
async function initFirebase(){
  const {initializeApp}=await import(
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
  );
  const {getDatabase,ref,onValue,set,remove,push}=await import(
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
  );

  const app=initializeApp(FIREBASE_CONFIG);
  const db=getDatabase(app);
  const gRef=ref(db,'groups');

  onValue(gRef,snap=>{
    groups={};

    snap.forEach(child=>{
      const g=child.val();
      if(validGroup(g)){
        groups[g.stt]={...g,_key:child.key};
      }
    });

    render();
    setStatus('online','Đã đồng bộ');
  },err=>{
    console.error('Firebase read error:',err);
    setStatus('offline','Chưa thể đồng bộ');
    grid.setAttribute('aria-busy','false');
    if(!hasRenderedOnce){
      document.getElementById('emptyTitle').textContent='Chưa tải được danh sách nhóm';
      document.getElementById('emptyDescription').textContent='Vui lòng kiểm tra kết nối và tải lại trang.';
    }
    showLocalBanner(
      'Firebase chưa đọc được dữ liệu — kiểm tra Realtime Database Rules.'
    );
  });

  window._saveGroup=async data=>{
    const newRef=push(gRef);
    await set(newRef,data);
  };

  window._updateGroup=async(stt,data)=>{
    const g=groups[stt];
    if(!g || !g._key) throw new Error('Không tìm thấy group để cập nhật.');
    await set(ref(db,'groups/'+g._key),data);
  };

  window._deleteGroup=async stt=>{
    const g=groups[stt];
    if(g && g._key){
      await remove(ref(db,'groups/'+g._key));
    }
  };
}

/* ═══ LOCAL FALLBACK ═══ */
function initLocal(){
  showLocalBanner(
    'chưa kết nối Firebase — đang dùng localStorage (chỉ lưu trên máy này).'
  );

  const LS_KEY='nhom_thuyet_trinh_v1';

  function load(){
    try{
      const stored=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
      return Object.fromEntries(Object.entries(stored||{}).filter(([,g])=>validGroup(g)));
    }
    catch(e){return {};}
  }
  function save(data){
    localStorage.setItem(LS_KEY,JSON.stringify(data));
  }

  groups=load();
  render();
  setStatus('local','Lưu trên máy này');

  window._saveGroup=async data=>{
    const next={...groups,[data.stt]:{...data,_key:String(data.stt)}};
    save(next);
    groups=next;
    render();
  };

  window._updateGroup=async(stt,data)=>{
    if(!groups[stt]) throw new Error('Không tìm thấy group để cập nhật.');
    const next={...groups,[stt]:{...data,_key:String(stt)}};
    save(next);
    groups=next;
    render();
  };

  window._deleteGroup=async stt=>{
    const next={...groups};
    delete next[stt];
    save(next);
    groups=next;
    render();
  };
}

/* ═══ RENDER — chỉ animate group mới ═══ */
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

function searchText(value){
  return value.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
}

searchInput.addEventListener('input',()=>render());
createGroupBtn.onclick=()=>openForm();
document.getElementById('emptyCreateBtn').onclick=()=>openForm();

function render(){
  grid.innerHTML='';

  const sorted=Object.values(groups).sort((a,b)=>a.stt-b.stt);
  const query=searchText(searchInput.value);
  const filtered=sorted.filter(g=>searchText('nhóm '+g.stt+' nhóm '+String(g.stt).padStart(2,'0')+' '+g.members.join(' ')).includes(query));
  const currentKeys=new Set(
    sorted.map(g=>String(g._key ?? g.stt))
  );

  filtered.forEach((g,index)=>{
    const el=widgetEl(g);
    const key=String(g._key ?? g.stt);

    if(!hasRenderedOnce || !seenGroupKeys.has(key)){
      el.classList.add('enter');
      el.style.setProperty(
        '--enter-delay',
        Math.min(index*35,210)+'ms'
      );
    }

    grid.appendChild(el);
  });

  if(sorted.length>0 && sorted.length<MAX && !query) grid.appendChild(createEl());
  counter.textContent=sorted.length+' / '+MAX;
  createGroupBtn.disabled=sorted.length>=MAX;
  document.getElementById('memberCount').textContent=sorted.reduce((n,g)=>n+g.members.length,0);
  document.getElementById('documentCount').textContent=sorted.reduce((n,g)=>n+['quiz','ppt','mp3'].filter(k=>safeLink(g.links[k])).length,0);
  const empty=document.getElementById('emptyState');
  empty.hidden=filtered.length>0;
  document.getElementById('emptyCreateBtn').hidden=Boolean(query)||sorted.length>0;
  document.getElementById('emptyTitle').textContent=query?'Không tìm thấy nhóm':'Chưa có nhóm';
  document.getElementById('emptyDescription').textContent=query?'Thử số nhóm hoặc tên thành viên khác.':'Thêm nhóm để chia sẻ tài liệu.';
  document.getElementById('searchStatus').textContent=query?filtered.length+' nhóm phù hợp.':sorted.length+' nhóm đã tham gia.';
  grid.setAttribute('aria-busy','false');
  searchInput.disabled=false;

  seenGroupKeys.clear();
  currentKeys.forEach(k=>seenGroupKeys.add(k));
  hasRenderedOnce=true;
}

function widgetEl(g){
  const d=document.createElement('button');
  d.type='button';
  d.className='widget';
  d.dataset.stt=g.stt;
  const number=String(g.stt).padStart(2,'0');
  const documents=['quiz','ppt','mp3'].filter(k=>safeLink(g.links[k])).length;
  d.setAttribute('aria-label','Nhóm '+number+' · '+g.members.length+' thành viên · Xem tài liệu');
  const names=g.members.slice(0,3).map(esc).join('\n');
  const more=g.members.length>3?'\n+ '+(g.members.length-3)+' thành viên khác':'';
  d.innerHTML=
    '<span class="w-top"><span class="w-group"><span class="w-icon">'+icon('users')+'</span><span><span class="w-num">Nhóm '+number+'</span><span class="w-sub">'+g.members.length+' thành viên</span></span></span><span class="w-status">'+icon('file')+documents+' tài liệu</span></span>'+
    '<span class="w-names">'+names+more+'</span>'+
    '<span class="w-footer"><span class="avatars" aria-hidden="true">'+g.members.slice(0,3).map(m=>'<span class="avatar">'+esc(initials(m))+'</span>').join('')+(g.members.length>3?'<span class="avatar">+'+(g.members.length-3)+'</span>':'')+'</span><span class="w-hint">Xem tài liệu'+icon('arrow')+'</span></span>';
  d.onclick=()=>openDetail(g.stt);
  return d;
}

function createEl(){
  const d=document.createElement('button');
  d.type='button';
  d.className='widget create';
  d.innerHTML=
    '<span class="create-icon">'+icon('plus')+'</span>'+
    '<span class="create-lbl">Tạo nhóm</span>';
  d.setAttribute('aria-label','Tạo nhóm mới');
  d.onclick=()=>openForm();
  return d;
}

function initials(name){
  return name.trim().split(/\s+/).slice(-2).map(part=>part[0]||'').join('').toLocaleUpperCase('vi');
}

/* ═══ MODALS ═══ */
function updateBodyLock(){
  const isOpen=document.querySelector('.overlay.open')!==null;
  document.body.classList.toggle('modal-open',isOpen);
  document.getElementById('pageContent').inert=isOpen;
}
function openO(id){
  returnFocus=document.activeElement;
  const overlay=document.getElementById(id);
  overlay.inert=false;
  overlay.removeAttribute('aria-hidden');
  overlay.classList.add('open');
  updateBodyLock();
  const first=id==='formOverlay'?overlay.querySelector('input:not(:disabled),textarea'):overlay.querySelector('button');
  first.focus({preventScroll:true});
}
function closeO(id){
  const overlay=document.getElementById(id);
  overlay.classList.remove('open');
  overlay.inert=true;
  updateBodyLock();
  const fallback=returnFocus?.dataset.stt?grid.querySelector('[data-stt="'+returnFocus.dataset.stt+'"]'):null;
  const target=returnFocus?.isConnected&&!returnFocus.disabled&&returnFocus.getClientRects().length?returnFocus:fallback||(!createGroupBtn.disabled?createGroupBtn:searchInput);
  target.focus({preventScroll:true});
  overlay.setAttribute('aria-hidden','true');
}

document.querySelectorAll('[data-close]').forEach(b=>
  b.onclick=()=>closeO(b.dataset.close)
);

document.querySelectorAll('.overlay').forEach(o=>
  o.addEventListener('click',e=>{
    if(e.target===o){
      closeO(o.id);
    }
  })
);

document.addEventListener('keydown',e=>{
  const overlay=document.querySelector('.overlay.open');
  if(!overlay) return;
  if(e.key==='Escape'){
    closeO(overlay.id);
  }
  if(e.key==='Tab'){
    const focusable=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,a[href]')];
    const first=focusable[0],last=focusable.at(-1);
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

function resetFormMode(){
  editingStt=null;
  formTitle.textContent='Tạo nhóm mới';
  saveBtn.textContent='Tạo nhóm';
  sttInput.disabled=false;
}

function openForm(stt=null){
  const form=document.getElementById('groupForm');
  form.reset();

  if(stt!==null && groups[stt]){
    const g=groups[stt];
    editingStt=stt;
    formTitle.textContent='Chỉnh sửa nhóm';
    saveBtn.textContent='Lưu thay đổi';
    sttInput.value=g.stt;
    sttInput.disabled=true;
    document.getElementById('fMembers').value=g.members.join('\n');
    document.getElementById('fQuiz').value=g.links.quiz;
    document.getElementById('fPpt').value=g.links.ppt;
    document.getElementById('fMp3').value=g.links.mp3;
  }else{
    resetFormMode();

    const used=new Set(Object.keys(groups).map(Number));
    let next=1;
    while(used.has(next)) next++;
    sttInput.value=next;
  }

  openO('formOverlay');
}

document.getElementById('groupForm').addEventListener('submit',async e=>{
  e.preventDefault();

  if(!editingStt && Object.keys(groups).length>=MAX){
    notify('Đã đủ '+MAX+' nhóm.',true);
    return;
  }

  const stt=parseInt(sttInput.value,10);
  if(!Number.isInteger(stt) || stt<1 || stt>99){
    notify('Số thứ tự phải nằm trong khoảng 1–99.',true);
    return;
  }

  if(!editingStt && groups[stt]){
    notify('Nhóm '+stt+' đã tồn tại. Hãy chọn số thứ tự khác.',true);
    sttInput.focus();
    return;
  }

  const members=document.getElementById('fMembers').value
    .split(/[\n,;]+/)
    .map(s=>s.trim())
    .filter(Boolean);

  if(!members.length){
    notify('Nhập ít nhất 1 thành viên.',true);
    return;
  }

  const quiz=document.getElementById('fQuiz').value.trim();
  const ppt=document.getElementById('fPpt').value.trim();
  const mp3=document.getElementById('fMp3').value.trim();

  for(const u of [quiz,ppt,mp3]){
    if(!safeLink(u)){
      notify('Nhập đường dẫn hợp lệ bắt đầu bằng https:// hoặc http://.',true);
      return;
    }
  }

  saveBtn.disabled=true;
  saveBtn.textContent='Đang lưu…';

  try{
    const data={
      stt,
      members,
      links:{quiz,ppt,mp3}
    };

    if(editingStt){
      await window._updateGroup(editingStt,data);
    }else{
      await window._saveGroup(data);
    }

    closeO('formOverlay');
    notify(editingStt?'Đã cập nhật nhóm.':'Đã tạo nhóm.');
  }catch(err){
    console.error(err);
    notify('Chưa lưu được thay đổi. Vui lòng kiểm tra kết nối hoặc quyền lưu dữ liệu và thử lại.',true);
  }finally{
    saveBtn.disabled=false;
    saveBtn.textContent=editingStt?'Lưu thay đổi':'Tạo nhóm';
  }
});

function openDetail(stt){
  const g=groups[stt];
  if(!g) return;

  currentStt=stt;
  document.getElementById('dTitle').textContent=
    'Nhóm '+String(g.stt).padStart(2,'0');

  document.getElementById('dMembers').innerHTML=
    g.members.map(m=>'<li><span class="avatar" aria-hidden="true">'+esc(initials(m))+'</span>'+esc(m)+'</li>').join('');

  for(const [id,key] of [['dQuiz','quiz'],['dPpt','ppt'],['dMp3','mp3']]){
    const link=document.getElementById(id);
    const href=safeLink(g.links[key]);
    if(href){link.href=href;link.removeAttribute('aria-disabled');}
    else{link.removeAttribute('href');link.setAttribute('aria-disabled','true');}
  }

  openO('detailOverlay');
}

editBtn.onclick=()=>{
  const stt=currentStt;
  closeO('detailOverlay');
  openForm(stt);
};

document.getElementById('dDelete').onclick=async()=>{
  if(!confirm('Xóa nhóm '+currentStt+'?')) return;

  try{
    await window._deleteGroup(currentStt);
    closeO('detailOverlay');
    notify('Đã xóa nhóm.');
  }catch(err){
    console.error(err);
    notify('Chưa xóa được nhóm. Vui lòng kiểm tra kết nối hoặc quyền xóa dữ liệu.',true);
  }
};

/* ═══ INIT ═══ */
if(USE_FIREBASE){
  setStatus('','Đang kết nối');

  initFirebase().catch(err=>{
    console.warn('Firebase init error:',err);
    setStatus('offline','Chưa kết nối');
    showLocalBanner(
      'Firebase không khởi tạo được — kiểm tra config / SDK / mạng.'
    );
    initLocal();
  });
}else{
  initLocal();
}
</script>
